# Einzelner Switch. Beispieladresse und SNMPv3-Benutzernamen lokal ersetzen.
[[secretstores.systemd]]
  id = "tplink"
  prefix = "telegraf."

[[inputs.snmp]]
  name = "tplink_sx3008f_poll"
  agents = ["udp://switch.example.invalid:161"]
  agent_host_tag = "source"
  interval = "30s"
  timeout = "3s"
  retries = 1
  version = 3
  sec_name = "monitoring-readonly"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "@{tplink:tplink_auth}"
  priv_protocol = "AES"
  priv_password = "@{tplink:tplink_priv}"
  tags = { device = "sx3008f" }
  taginclude = ["device", "index"]

  [[inputs.snmp.field]]
    name = "uptime_ticks"
    oid = ".1.3.6.1.2.1.1.3.0" # sysUpTime.0

  [[inputs.snmp.table]]
    name = "tplink_sx3008f_port"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "oper_status"
      oid = ".1.3.6.1.2.1.2.2.1.8" # ifOperStatus

    [[inputs.snmp.table.field]]
      name = "admin_status"
      oid = ".1.3.6.1.2.1.2.2.1.7" # ifAdminStatus

    [[inputs.snmp.table.field]]
      name = "speed_mbps"
      oid = ".1.3.6.1.2.1.31.1.1.1.15" # ifHighSpeed

    [[inputs.snmp.table.field]]
      name = "in_octets_total"
      oid = ".1.3.6.1.2.1.31.1.1.1.6" # ifHCInOctets

    [[inputs.snmp.table.field]]
      name = "out_octets_total"
      oid = ".1.3.6.1.2.1.31.1.1.1.10" # ifHCOutOctets

    [[inputs.snmp.table.field]]
      name = "in_errors_total"
      oid = ".1.3.6.1.2.1.2.2.1.14" # ifInErrors

    [[inputs.snmp.table.field]]
      name = "out_errors_total"
      oid = ".1.3.6.1.2.1.2.2.1.20" # ifOutErrors

    [[inputs.snmp.table.field]]
      name = "in_discards_total"
      oid = ".1.3.6.1.2.1.2.2.1.13" # ifInDiscards

    [[inputs.snmp.table.field]]
      name = "out_discards_total"
      oid = ".1.3.6.1.2.1.2.2.1.19" # ifOutDiscards

[[processors.filter]]
  namepass = ["tplink_sx3008f_port"]
  default = "drop"

  [[processors.filter.rule]]
    tags = { index = ["49153", "49154", "49155", "49156", "49157", "49158", "49159", "49160"] }
    action = "pass"

[[outputs.prometheus_client]]
  listen = "127.0.0.1:9273"
  metric_version = 1
  expiration_interval = "90s"
  string_as_label = false
  namepass = ["tplink_sx3008f_poll", "tplink_sx3008f_port"]

  [outputs.prometheus_client.metric_types]
    counter = ["tplink_sx3008f_port_*_total"]
